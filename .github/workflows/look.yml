# Blaze Desktop LOOK TOUR (0.19.17 QA) on the TEMPORARY PUBLIC build repo. Runs only on pushes to look/**.
# Builds the real app from the scrubbed snapshot and drives it with BLAZE_LOOK_TOUR (looktour.js): every
# main view and glass panel at each window size, light and dark, screenshotted by the runner's own OS tools.
# No secrets, no sign-in (demo/offline: fresh profile, no keys), read-only token, artifacts kept 3 days.
name: look
on:
  push:
    branches: ['look/**']
permissions:
  contents: read
concurrency:
  group: look-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.26.10', cache: true, cache-dependency-path: go.sum }
      - name: Screen 1920x1080
        shell: pwsh
        run: |
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force -ErrorAction Stop; "set" } catch { "Set-DisplayResolution failed: $_" }
          Add-Type -AssemblyName System.Windows.Forms
          [System.Windows.Forms.Screen]::PrimaryScreen | Format-List Bounds, WorkingArea
          Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}' -ErrorAction SilentlyContinue | Select-Object pv
      - name: Build Blaze.exe (windows/amd64, same flags as the release)
        shell: bash
        run: |
          V=$(tr -d ' \n\r' < VERSION)
          CGO_ENABLED=0 go build -tags desktop,production -trimpath -ldflags "-H windowsgui -s -w -X main.version=v${V}" -o blaze.exe .
          ls -la blaze.exe
      - name: Tour
        shell: pwsh
        run: ./.github/scripts/tour-windows.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: look-windows, path: shots/, retention-days: 3, if-no-files-found: warn }

  macos:
    runs-on: macos-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.26.10', cache: true, cache-dependency-path: go.sum }
      - name: Build Blaze.app (darwin/arm64)
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
          V=$(tr -d ' \n\r' < VERSION)
          wails build -platform darwin/arm64 -s -skipbindings -trimpath -clean -ldflags "-s -w -X main.version=v${V}"
          system_profiler SPDisplaysDataType | grep -i -E "resolution|display" || true
      - name: Tour
        run: bash .github/scripts/tour-mac.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: look-macos, path: shots/, retention-days: 3, if-no-files-found: warn }
